services:
  - type: web
    name: kaliszewski-maciej-cv
    runtime: static
    buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile && pnpm run build:cv-site
    staticPublishPath: artifacts/cv-site/dist/public
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: CI
        value: "true"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: BASE_PATH
        value: /
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
